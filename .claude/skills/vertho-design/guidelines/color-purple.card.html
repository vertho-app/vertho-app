<!-- @dsCard group="Colors" viewport="700x150" name="Purple accent" subtitle="Secondary accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-body); background: var(--surface-card); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 12px; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--vh-purple-100);color:var(--vh-purple-700)"><span class="name">purple-100</span><span class="hex">#f3e3ff</span></div>
  <div class="sw" style="background:var(--vh-purple-300);color:var(--vh-purple-700)"><span class="name">purple-300</span><span class="hex">#e1aaff</span></div>
  <div class="sw" style="background:var(--vh-purple-500);color:#fff"><span class="name">purple-500 ★</span><span class="hex">#9e4edd</span></div>
  <div class="sw" style="background:var(--vh-purple-700);color:#fff"><span class="name">purple-700</span><span class="hex">#3b0a6d</span></div>
</div>
</body>
</html>
