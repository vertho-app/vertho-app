<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Indigo-tinted gray ramp for text & surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-body); background: var(--surface-card); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; border-radius: var(--radius-sm); height: 92px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .name { font-size: 10px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 9px; opacity: 0.8; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--vh-gray-50);color:var(--vh-gray-700);border:1px solid var(--border-subtle)"><span class="name">50</span></div>
  <div class="sw" style="background:var(--vh-gray-100);color:var(--vh-gray-700)"><span class="name">100</span></div>
  <div class="sw" style="background:var(--vh-gray-200);color:var(--vh-gray-700)"><span class="name">200</span></div>
  <div class="sw" style="background:var(--vh-gray-300);color:var(--vh-gray-800)"><span class="name">300</span></div>
  <div class="sw" style="background:var(--vh-gray-400);color:#fff"><span class="name">400</span></div>
  <div class="sw" style="background:var(--vh-gray-500);color:#fff"><span class="name">500</span></div>
  <div class="sw" style="background:var(--vh-gray-600);color:#fff"><span class="name">600</span></div>
  <div class="sw" style="background:var(--vh-gray-700);color:#fff"><span class="name">700</span></div>
  <div class="sw" style="background:var(--vh-gray-800);color:#fff"><span class="name">800</span></div>
  <div class="sw" style="background:var(--vh-gray-900);color:#fff"><span class="name">900</span></div>
</div>
</body>
</html>
