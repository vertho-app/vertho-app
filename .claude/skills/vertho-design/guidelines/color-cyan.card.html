<!-- @dsCard group="Colors" viewport="700x150" name="Cyan accent" subtitle="Primary accent — the on-dark logo color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-body); background: var(--surface-card); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 12px; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--vh-cyan-100);color:var(--vh-cyan-700)"><span class="name">cyan-100</span><span class="hex">#dbf6f7</span></div>
  <div class="sw" style="background:var(--vh-cyan-300);color:var(--vh-indigo-900)"><span class="name">cyan-300</span><span class="hex">#9ae2e6</span></div>
  <div class="sw" style="background:var(--vh-cyan-500);color:var(--vh-indigo-900)"><span class="name">cyan-500 ★</span><span class="hex">#34c5cc</span></div>
  <div class="sw" style="background:var(--vh-cyan-700);color:#fff"><span class="name">cyan-700</span><span class="hex">#1c8a90</span></div>
</div>
</body>
</html>
