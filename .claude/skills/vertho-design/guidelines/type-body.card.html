<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; font-family: var(--font-body); background: var(--surface-card); }
  .lead { font-size: var(--text-md); font-weight: 600; color: var(--text-strong); margin: 0 0 8px; }
  .p { font-size: var(--text-base); line-height: var(--lh-normal); color: var(--text-body); margin: 0 0 8px; max-width: 58ch; }
  .cap { font-family: var(--font-ui); font-size: var(--text-xs); font-weight: 600; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-muted); margin: 0; }
</style>
</head>
<body>
  <p class="lead">Inter SemiBold — 18px, destaque</p>
  <p class="p">Inter Regular — 16px, corpo. A Vertho ajuda escolas e empresas a desenvolver competências com método: mapeamento comportamental, trilhas de aprendizagem e acompanhamento por IA. Texto neutro e legível em telas e PDFs.</p>
  <p class="cap">Overline · rótulo · Plus Jakarta Sans</p>
</body>
</html>
