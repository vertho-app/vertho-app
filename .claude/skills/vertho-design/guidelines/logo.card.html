<!-- @dsCard group="Brand" viewport="700x220" name="Logo" subtitle="vertho.ai — horizontal lockup, light & dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); }
  .split { display: grid; grid-template-columns: 1fr 1fr; height: 220px; }
  .cell { display: flex; align-items: center; justify-content: center; padding: 30px; }
  .light { background: var(--surface-card); }
  .dark { background: var(--surface-inverse-deep); }
  img { max-width: 78%; max-height: 92px; }
</style>
</head>
<body>
<div class="split">
  <div class="cell light"><img src="../assets/logo-h-escuro.png" alt="vertho.ai logo" /></div>
  <div class="cell dark"><img src="../assets/logo-h-claro.png" alt="vertho.ai logo reversed" /></div>
</div>
</body>
</html>
