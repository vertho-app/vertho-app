# Atualizações de versão propostas pelo Dependabot (auditoria de segurança 23/10/2026).
#
# `cooldown`: a versão nova só vira PR depois de N dias publicada. Pacote sequestrado
# costuma ser retirado do registry em horas ou poucos dias (Shai-Hulud, ChainDrop,
# node-ipc em 2026), então esperar é a defesa mais barata contra a versão envenenada.
# O cooldown NÃO vale para os "security updates" (ligados à parte, em Settings →
# Code security).
#
# Política (ajustada em 23/10, depois da 1ª rodada abrir 4 PRs na hora, um com 30
# pacotes e dois com major):
# - patch: um PR agrupado por ecossistema;
# - minor: um PR por pacote (até `open-pull-requests-limit` abertos), para dar para
#   ler o changelog de cada um;
# - major: NÃO vira PR. É decisão do dono, feita à mão. Atenção: a doc do GitHub marca
#   o `ignore` como opção que também afeta security updates, então uma correção que
#   só exista em major aparece no ALERTA, não em PR.
#
# Cada PR roda o typecheck.yml (pull_request, sem secrets) e gera um preview na Vercel.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Trigger.dev em PR próprio: o SDK do app e o worker publicado andam juntos, e o
      # deploy do worker é MANUAL (`npx trigger.dev@<versão> deploy`); ver CLAUDE.md.
      trigger-dev:
        patterns:
          - '@trigger.dev/*'
      npm-patches:
        update-types:
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Família Remotion travada em 4.0.476: o bundle do worker Hetzner e o app têm de
      # usar a mesma versão (docs/SECURITY-STATUS.md, 06/10). Sobe à mão, junto.
      - dependency-name: remotion
      - dependency-name: '@remotion/*'

  - package-ecosystem: npm
    directory: /worker-hetzner
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      worker-patches:
        update-types:
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@remotion/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /worker-hetzner
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    ignore:
      # Troca de linha do Node (22 → 24/26) é decisão, não atualização: só patch/minor.
      - dependency-name: node
        update-types:
          - version-update:semver-major
