<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); }
  .row { display: flex; height: 200px; }
  .cell { flex: 1; display: flex; align-items: center; justify-content: center; }
  .light { background: var(--surface-card); }
  .dark { background: var(--surface-inverse-deep); }
  .accent { background: var(--vh-gradient); }
  img { height: 84px; }
</style>
</head>
<body>
<div class="row">
  <div class="cell light"><img src="../assets/icone-escuro.png" alt="mark" /></div>
  <div class="cell dark"><img src="../assets/icone-claro.png" alt="mark reversed" /></div>
  <div class="cell accent"><img src="../assets/icone-claro.png" alt="mark on gradient" /></div>
</div>
</body>
</html>
