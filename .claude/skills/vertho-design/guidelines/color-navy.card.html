<!-- @dsCard group="Colors" viewport="700x150" name="Brand navy" subtitle="Primary text & action — what the app and PDFs lead with" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; font-family: var(--font-ui); background: var(--surface-card); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 12px; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
  .logo { color: var(--vh-cyan-300); }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background:var(--vh-navy-900)"><span class="name">navy-900</span><span class="hex">#06152b</span></div>
  <div class="sw" style="background:var(--vh-navy-700)"><span class="name">navy-700</span><span class="hex">#0a1f3f</span></div>
  <div class="sw" style="background:var(--vh-navy-500);outline:2px solid var(--vh-cyan-500);outline-offset:2px"><span class="name">navy-500 ★</span><span class="hex">#0f2b54</span></div>
  <div class="sw" style="background:var(--vh-navy-300)"><span class="name">navy-300</span><span class="hex">#2f568c</span></div>
  <div class="sw" style="background:var(--vh-indigo-700)"><span class="name logo">indigo-700</span><span class="hex logo">#3c385f · logo ink</span></div>
</div>
</body>
</html>
