name: RLS Posture (banco vivo)

# Confere a postura de RLS/GRANT do BANCO — o que nenhuma verificação estática
# alcança: policy criada à mão, GRANT solto, MV exposta a anon.
#
# Por que é um workflow SEPARADO, e não mais um passo do typecheck:
#   · o job de PR executa código do PRÓPRIO PR. Dar a ele `DATABASE_URL` de
#     produção seria entregar a credencial a quem pode modificar o que roda.
#     A verificação estática (`rls-policy-estatica-guard`) é que vai na PR;
#   · aqui `RLS_POSTURE_REQUIRED=1` faz o guard FALHAR se o banco não vier —
#     `describe.skipIf(!DATABASE_URL)` sozinho é verde sem ter rodado, que foi
#     como o F1 (acervo de 10 tenants aberto) ficou 3 meses sem ninguém ver.
#
# 🔑 O secret `DATABASE_URL` deve ser de um usuário SOMENTE-LEITURA DE CATÁLOGO,
# não do dono do banco. Este guard só faz SELECT em `pg_policies`, `pg_class`,
# `pg_proc` e `information_schema`.
#
# ⚠️ ARMADILHA, corrigida em 10/08 depois de uma revisão crítica: o SQL que eu
# tinha escrito aqui ("sem GRANT em tabela nenhuma") produziria um guard CEGO.
# `information_schema.columns` **não mostra tudo** — ela filtra pelo que o papel
# enxerga. Um usuário sem privilégio em tabela alguma veria ZERO colunas, e o
# INV2 (que descobre as tabelas tenant-owned justamente por `column_name =
# 'empresa_id'`) encontraria zero tabelas e passaria verde por não ver nada.
# Exatamente a classe que este job existe para impedir.
#
# Por isso o papel precisa de SELECT nas tabelas — ele nunca lê LINHA nenhuma
# (só catálogo), mas o privilégio é o que torna o catálogo visível:
#
#   CREATE ROLE ci_rls_audit LOGIN PASSWORD '<gerar>';
#   GRANT CONNECT ON DATABASE postgres TO ci_rls_audit;
#   GRANT USAGE ON SCHEMA public TO ci_rls_audit;
#   GRANT SELECT ON ALL TABLES IN SCHEMA public TO ci_rls_audit;
#   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO ci_rls_audit;
#
# ⚠️ E como `ci_rls_audit` NÃO tem BYPASSRLS, o RLS continua valendo para ele —
# o GRANT acima não lhe dá as linhas, só a visibilidade do catálogo. Se um dia
# este papel passar a enxergar dado de tenant, isso é achado, não configuração.
# Alternativa mais restrita, se preferir: `pg_read_all_stats` + GRANT SELECT
# apenas em `information_schema.columns`.
#
# Enquanto o secret não existir, este job FALHA de propósito — é um lembrete
# visível, e ele não bloqueia PR nem push.

on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC, depois do backup das 04h
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'migrations/**'
      - 'tests/unit/security/rls-posture.test.ts'

jobs:
  rls-posture:
    name: Postura de RLS contra o banco
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `engines` do package.json exige >=24.13.1 — com Node 20 o `npm ci`
          # recusa (`notsup`) e o job falha ANTES de rodar o teste. Um job que
          # falha pelo motivo errado não é o alarme que ele diz ser: mesmo com o
          # secret configurado, ele continuaria vermelho pelo mesmo erro.
          # (O `smoke-test.yml` ainda usa 20 e funciona porque não faz `npm ci`.)
          node-version: '24.13.1'
          cache: 'npm'

      - run: npm ci

      # A pré-condição é verificada AQUI, no shell, e não dentro do teste.
      # Motivo medido em 10/08: com `describe.skipIf(...)` dependendo de uma env,
      # o processo do vitest não recebeu `RLS_POSTURE_REQUIRED` e o arquivo
      # inteiro foi SKIPADO — o guard contra "verde sem ter rodado" caindo
      # exatamente nesse defeito, na primeira execução. Um `[ -z ]` no shell não
      # tem essa sutileza: ou o secret existe, ou o job para aqui com a razão na
      # tela.
      - name: exige o secret (sem banco não há o que verificar)
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::secret DATABASE_URL ausente. Este job existe para conferir o BANCO VIVO — sem credencial ele não verifica nada, e passar assim seria um verde que afirma o que não foi medido. Crie o secret com um usuário SOMENTE-LEITURA de catálogo (SQL no cabeçalho deste arquivo)."
            exit 1
          fi

      - name: rls-posture contra o banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx vitest run tests/unit/security/rls-posture.test.ts

      - name: Reportar
        if: failure()
        run: echo "::error::Postura de RLS do banco regrediu (ou o secret DATABASE_URL não está configurado). Ver tests/unit/security/rls-posture.test.ts"
