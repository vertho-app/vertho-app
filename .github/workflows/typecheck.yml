name: TypeScript

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # i18n:check (28/08): existia como script desde sempre e NINGUÉM o invocava
      # — a auditoria de guards do dia achou 0 executores. Determinístico e rápido
      # (3114 keys × 4 locales, <10s), então o lugar dele é aqui, junto do
      # typecheck, e não num workflow próprio.
      - name: i18n keys completas (4 locales)
        run: npm run i18n:check

      # Fail-closed de INVENTÁRIO (30/08). A suíte não assere o próprio tamanho,
      # então um arquivo de teste renomeado para fora de `tests/unit/**/*.test.ts`
      # some da coleta com o CI VERDE: 318 vira 317 e ninguém lê a diferença.
      # É o mesmo modo de falha que o passo "o guard rodou de verdade?" do job
      # `action-ids` fecha para o build, e que a auditoria dos guards de tenant
      # apontou como a única lacuna de fail-closed que sobrou nos 13 auditados.
      #
      # Roda ANTES da suíte de propósito: é barato, não depende de npm, e falha
      # rápido dizendo o que sumiu em vez de deixar a suíte reportar um total
      # menor que ninguém compara com nada.
      #
      # O piso SÓ SOBE. Se um teste for removido de propósito (código morto que
      # saiu junto, por exemplo), baixe o número AQUI, no mesmo commit, com o
      # motivo na mensagem. É o mesmo contrato das allowlists do repo: o número
      # é uma declaração, e mexer nele tem que ser um ato consciente.
      - name: a suíte não encolheu (inventário fail-closed)
        run: |
          PISO_TOTAL=318
          PISO_SEC=75
          total=$(git ls-files tests/unit | grep -c '\.test\.ts$')
          sec=$(git ls-files tests/unit/security | grep -c '\.test\.ts$')
          echo "test files: $total (piso $PISO_TOTAL) · security: $sec (piso $PISO_SEC)"
          falhou=0
          if [ "$total" -lt "$PISO_TOTAL" ]; then
            echo "::error::a suíte ENCOLHEU: $total arquivos .test.ts em tests/unit, piso é $PISO_TOTAL. Algum teste saiu da coleta (renomeado, movido para fora do padrão do vitest, ou removido). Se foi de propósito, baixe o piso neste arquivo no mesmo commit, com o motivo."
            falhou=1
          fi
          if [ "$sec" -lt "$PISO_SEC" ]; then
            echo "::error::tests/unit/security ENCOLHEU: $sec arquivos, piso é $PISO_SEC. Guard de segurança não some em silêncio."
            falhou=1
          fi
          exit $falhou

      - name: Security tests + service-role guard
        run: npm run test:unit

      - name: Report result
        if: failure()
        run: echo "::error::TypeScript check or security tests failed. Run 'npm run typecheck' and 'npm run test:unit' locally to see errors."

  # Guard de BUNDLE: nenhuma action com flag `internal` pode ter o action id
  # publicado no JS que o browser baixa (= endpoint sem gate, chamável por
  # qualquer um). Exige `next build`, por isso vive em job separado — no
  # `test:unit` acima o teste SKIPA por falta de build.
  action-ids:
    name: action ids não vazam pro bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # O build não fala com o banco (todas as rotas são dinâmicas); só precisa
      # das envs existirem. Valores dummy bastam — nada aqui é secreto.
      - name: Build + guard
        run: npm run test:action-ids
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key

      # A pré-condição, no SHELL — E10 da auditoria 22/08.
      #
      # O guard vive atrás de `describe.skipIf(!temBuild)`: sem o manifesto do
      # build ele SKIPA, e skip é verde. É o mesmo defeito que o `rls-posture`
      # teve em 10/08 — o job existia para provar algo e passava sem ter
      # observado nada. Aqui o artefato é um arquivo, então a checagem é direta:
      # se ele não existe depois do build, o guard não rodou, e o job tem de
      # parar dizendo isso em vez de reportar sucesso.
      - name: o guard rodou de verdade? (skip é verde, e verde sem medição mente)
        run: |
          # A MESMA condição do `describe.skipIf` do teste — `.next/BUILD_ID` só
          # existe em build de produção COMPLETO (o `next dev` também popula
          # `.next/`, e build interrompido não deixa BUILD_ID).
          faltando=""
          for artefato in .next/BUILD_ID .next/server/chunks .next/static/chunks; do
            [ -e "$artefato" ] || faltando="$faltando $artefato"
          done
          if [ -n "$faltando" ]; then
            echo "::error::artefato(s) de build ausente(s):$faltando — o guard de action ids SKIPOU (skipIf é verde) e o job passaria sem ter olhado bundle nenhum. Confira se o 'next build' concluiu."
            exit 1
          fi
          echo "build completo: BUILD_ID=$(cat .next/BUILD_ID)"

      - name: Report result
        if: failure()
        run: echo "::error::Um action id de action com flag 'internal' foi publicado no bundle do cliente, ou o guard ficou cego. Rode 'npm run test:action-ids' localmente."
